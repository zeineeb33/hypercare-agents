[project]
name = "hypercare-agents"
version = "0.1.0"
description = "Multi-agent support system for software hypercare: grounded answers, independent verification and a self-healing knowledge base."
readme = "README.md"
license = "MIT"
authors = [{ name = "Zeineb Jemli" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.12.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "streamlit>=1.67.0",
    "typer>=0.29.2",
]

[project.scripts]
hypercare = "hypercare.cli:app"

[project.optional-dependencies]
embeddings = [
    "fastembed>=0.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hypercare"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["snowflake"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "PT", "RUF", "C4", "PL", "N"]
ignore = [
    "PLR0913", # agent constructors take several collaborators
    "PLR2004", # thresholds are named in config; literals are fine in tests
    "E501",    # line width is enforced by `ruff format`; prompts keep natural lines
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLC0415"]
"src/hypercare/cli.py" = ["PLC0415"]
# One block per pipeline step / per check reads better than splitting into helpers.
"src/hypercare/agents/orchestrator.py" = ["PLR0915"]
"src/hypercare/agents/verification.py" = ["PLR0912", "PLR0915"]
"src/hypercare/ui/**" = ["PLC0415", "PLR0915", "PLR0912"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["hypercare"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["hypercare"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
