name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # No API key in CI: tests use a fake LLM and a local stub server.
      - run: uv run pytest --cov --cov-report=term

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hypercare-agents .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8501:8501 hypercare-agents
          for i in $(seq 1 30); do curl -sf localhost:8501/_stcore/health && break; sleep 2; done
          curl -sf localhost:8501/_stcore/health
          docker exec app hypercare run 23
          docker logs app
